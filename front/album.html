<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusiSky · Альбом</title>
    <style>
        /* ----- ОБЩИЕ СТИЛИ (из твоего файла) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0c12 0%, #0f111a 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #eef2ff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
            max-width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* левая панель */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: linear-gradient(165deg, rgba(25, 28, 42, 0.98) 0%, rgba(18, 20, 32, 0.98) 100%);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(101, 255, 160, 0.25);
            box-shadow: 8px 0 32px rgba(0, 0, 0, 0.4);
            padding: 28px 20px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 36px;
            overflow-y: auto;
            scrollbar-width: thin;
            z-index: 2;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: -0.2px;
            color: #b4bbd9;
            transition: all 0.2s ease;
            cursor: pointer;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .playlists-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 380px);
            overflow-y: auto;
            padding-right: 4px;
            margin-right: -4px;
        }

        .playlist-page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .playlist-page.active-page {
            display: block;
        }

        .nav-item:hover {
            background: rgba(101, 255, 160, 0.12);
            color: #e2ffe8;
        }

        .nav-item .image {
            width: 20px;
            height: 20px;
            filter: brightness(0) saturate(100%) invert(75%) sepia(8%) saturate(500%) hue-rotate(200deg);
            transition: filter 0.2s;
        }

        .nav-item:hover .image {
            filter: brightness(0) saturate(100%) invert(85%) sepia(60%) saturate(800%) hue-rotate(70deg) brightness(1.1);
        }

        .nav-item.special {
            margin-top: auto;
        }

        .nav-item-pad {
            width: 30px;
            height: 30px;
        }

        .nav-item-pad img {
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }

        .menu-user {
            margin-top: auto;
            font-size: 11px;
            color: #b4bbd9;
            display: flex;
            flex-direction: column;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 30px 16px;
            color: #b4bbd9;
            letter-spacing: -0.2px;
            border: none;
            padding-top: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .user-item:hover {
            color: #65FFA0;
        }

        .user-item img {
            filter: brightness(0) saturate(100%) invert(75%) sepia(8%) saturate(500%) hue-rotate(200deg);
            transition: filter 0.2s;
            margin-right: 6px;
        }

        .user-item:hover img {
            filter: brightness(0) saturate(100%) invert(85%) sepia(60%) saturate(800%) hue-rotate(70deg) brightness(1.1);
        }

        .divider {
            height: 1px;
            background: rgba(101, 255, 160, 0.25);
            margin: 8px 0 12px 0;
        }

        .playlists-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #6d7490;
            margin-bottom: 12px;
            padding-left: 8px;
        }

        .nav-item.active {
            background: rgba(101, 255, 160, 0.18);
            color: #ccffdd;
            border-left: 2px solid #65FFA0;
        }
        .nav-item.active .image {
            filter: brightness(0) saturate(100%) invert(85%) sepia(60%) saturate(800%) hue-rotate(70deg) brightness(1.1);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px 40px 40px;
            scroll-behavior: smooth;
            transition: margin-right 0.3s ease;
        }

        .main-content.player-open {
            margin-right: 380px;
        }

        /* стили для страницы альбома / исполнителя */
        /* .page {
            flex: 1;
            padding: 32px 36px;
            overflow-y: auto;
            scrollbar-width: thin;
            background: rgba(10, 12, 18, 0.3);
        } */

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active-page {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- АЛЬБОМ ----- */
        .album-header {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            /* flex: 1;
            padding: 32px 36px;
            overflow-y: auto;
            scrollbar-width: thin;
            background: rgba(10, 12, 18, 0.3);  */
        }

        .album-cover {
            width: 220px;
            height: 220px;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid #65FFA0;
            background: linear-gradient(145deg, #1e3a2f, #0e1f1a);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* .album-cover svg {
            width: 100px;
            height: 100px;
            opacity: 0.9;
            color: #65FFA0;
        } */

        .album-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-note-icon {
            width: 100px;
            height: 100px;
            opacity: 0.9;
            color: #65FFA0;
        }

        .album-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .album-type {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #65FFA0;
            text-transform: uppercase;
        }

        .album-title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff, #65FFA0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 8px 0 12px 0;
        }

        .album-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #b4bbd9;
        }

        .album-meta .dot {
            width: 4px;
            height: 4px;
            background: #65FFA0;
            border-radius: 50%;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            margin: 28px 0 32px 0;
        }

        .btn-primary {
            background: #65FFA0;
            color: #0a0c12;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(101, 255, 160, 0.2);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            background: #8affb8;
        }

        /* .btn-secondary {
            background: transparent;
            border: 1px solid rgba(101, 255, 160, 0.5);
            color: #ccffdd;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(101, 255, 160, 0.1);
            border-color: #65FFA0;
        } */

        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(101, 255, 160, 0.5);
            /* background: rgba(25, 28, 42, 0.98); */
            color: #b4bbd9;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(101, 255, 160, 0.3);
            color: #65FFA0;
            transform: scale(1.03);
            border: 2px solid rgba(101, 255, 160, 0.541);
        }

        .tracklist {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 20px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(25, 28, 42, 0.98);
            transition: all 0.2s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .track-item:hover {
            background: rgba(35, 39, 55, 0.8);
            border-color: rgba(101, 255, 160, 0.5);
            transform: translateX(4px);
        }

        .track-container {
            display: flex;
            align-items: center;
        }

        .track-image {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .track-image img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .track-name {
            font-weight: 600;
            font-size: 16px;
            color: #f0f3ff;
        }

        .track-artist {
            font-size: 13px;
            color: #8f97b5;
        }

        .track-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            color: #b5ffd0;
            background: rgba(101, 255, 160, 0.12);
            padding: 4px 10px;
            border-radius: 28px;
        }

        .tracklist-header {
            display: grid;
            /* grid-template-columns: 30px 1fr 100px 80px; */
            padding: 5px 16px;
            color: #8f97b5;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 8px;
        }

        /* кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #171a27;
        }
        ::-webkit-scrollbar-thumb {
            background: #3d5e4a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #65FFA0;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 240px;
            }
            .album-header {
                padding: 20px;
            }
            .player-panel {
                width: 320px;
            }
            .main-content.player-open {
                margin-right: 320px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- МЕНЮ (как в исходнике) -->
    <aside class="sidebar">
        <div class="logo-area">
            <img src="images/logo.svg" alt="Логотип" style="width: 32px; height: 32px;" onerror="this.style.opacity=0.5">
            <span style="font-weight: 700; font-size: 20px; letter-spacing: -0.3px; background: linear-gradient(135deg, #fff, #65FFA0); background-clip: text; -webkit-background-clip: text; color: transparent;">MusiSky</span>
        </div>
        <div class="nav-menu">
            <button class="nav-item" type="button" onclick="window.location.href='album.html'">
                <img class="image" src="images/home.svg" alt="home icon" width="20" height="20">
                <span>Домой</span>
            </button>
            <button class="nav-item" id="searchNavBtn" type="button">
                <img class="image" src="images/loupe.svg" alt="search icon" width="20" height="20">
                <span>Поиск</span>
            </button>
            <div class="divider"></div>
            <div class="playlists-title">ВАШИ ПЛЕЙЛИСТЫ</div>
            <div class="playlists-container" id="playlistsContainer">
                <button class="nav-item" id="favoritesBtn" type="button">
                    <div class="nav-item-pad"><img src="images/pad.svg" alt="new playlist icon"></div>
                    <span>Любимые треки</span>
                </button>
                <button class="nav-item" type="button" data-playlist-id="playlist_1">
                    <img class="image" src="images/pen.svg" alt="new playlist icon" width="20" height="20">
                    <span>Новый плейлист 1</span>
                </button>
            </div>
            <button class="nav-item special" id="createPlaylistBtn" type="button">
                <img class="image" src="images/plus.svg" alt="create playlist icon" width="20" height="20">
                <span>Создать плейлист</span>
            </button>
        </div>
        <div class="menu-user">
            <div class="divider" style="margin: 0 0 1px 0;"></div>
            <button class="user-item profile-btn" type="button">
                <img src="images/user.svg" alt="user" width="16" height="16"> 
                <span>Профиль</span>
            </button>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <!-- СТРАНИЦА АЛЬБОМА -->
        <div class="page active-page">
            <div class="album-header">
                <div class="album-cover">
                    <!-- svg заглушка обложки -->
                    <!-- <svg class="album-note-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                    </svg> -->
                    <img class="album-cover-img" src="hffttps://avatars.mds.yandex.net/i?id=1beef03c75bcb66aec4feae2d1373d04dc449a8a-7066306-images-thumbs&n=13" alt="Фото исполнителя" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                    <svg class="album-note-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                    </svg>
                </div>
                <div class="album-info">
                    <span class="album-type">Альбом</span>
                    <h1 class="album-title">After Hours</h1>
                    <div class="album-meta">
                        <span class="artist-link" style="font-weight:600; color:#fff;">The Weeknd</span>
                        <span class="dot"></span>
                        <span>2020</span>
                        <span class="dot"></span>
                        <span>20 треков, 1 ч 14 мин</span>
                    </div>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn-primary">
                    <span>▶</span> Слушать
                </button>
                <button class="btn-secondary">Сохранить как плейлист</button>
                <!-- <button class="btn-secondary">⋯</button> -->
            </div>

            <!-- Шапка треклиста -->
            <div class="tracklist-header">
                <!-- <div>#</div>
                <div>Название</div>
                <div></div>
                <div>⏱</div> -->
            </div>

            <!-- 20 треков -->
            <div class="tracklist" id="albumTracklist"></div>
        </div>
    </main>
</div>

<script>
    (function() {
        // Генерация 20 треков в стиле альбома
        const tracklist = document.getElementById('albumTracklist');
        const trackNames = [
            "Alone Again", "Too Late", "Hardest to Love", "Scared to Live", "Snowchild",
            "Escape from LA", "Heartless", "Faith", "Blinding Lights", "In Your Eyes",
            "Save Your Tears", "Repeat After Me", "After Hours", "Until I Bleed Out",
            "Nothing Compares", "Missed You", "Final Lullaby", "Over Now", "Take Me Back", "Devil May Cry"
        ];
        for (let i = 0; i < 20; i++) {
            const div = document.createElement('div');
            div.className = 'track-item';
            div.setAttribute('data-track-id', i+1);
            const mins = Math.floor(Math.random() * 3 + 2);
            const secs = Math.floor(Math.random() * 60).toString().padStart(2,'0');
            div.innerHTML = `
                <div class="track-container">
                    <div class="track-image">
                        <img src="images/pad.svg" alt="track" onerror="this.style.background='#1e3a2f'; this.src='data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'%2365FFA0\\'%3E%3Ccircle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/%3E%3C/svg%3E'">
                    </div>
                    <div class="track-info">
                        <div class="track-name">${trackNames[i % trackNames.length]} ${i+1 > trackNames.length ? '(Deluxe)' : ''}</div>
                        <div class="track-artist">The Weeknd</div>
                    </div>
                </div>
                <div class="track-time">${mins}:${secs}</div>
            `;
            tracklist.appendChild(div);
        }
    })();
</script>
</body>
</html>
